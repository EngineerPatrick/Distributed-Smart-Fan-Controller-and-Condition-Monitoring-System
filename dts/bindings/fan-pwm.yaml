include: base.yaml

description: 4-wire PC case fan.

compatible: "fan-pwm"

properties:
  pwms:
    required: true
    type: phandle-array
    description: |
      Reference to a PWM instance.

      Includes the PWM channel, the waveform period and
      the PWM polarity.

  counter-captures:
    required: true
    type: phandle-array
    description: |
      Reference to a counter instance.

      Includes the counter channel and the capture edge.
