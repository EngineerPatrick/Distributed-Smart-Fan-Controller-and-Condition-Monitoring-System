include: base.yaml

description: 4-wire PC case fan.

compatible: "fan-pwm"

properties:
  pwms:
    required: true
    type: phandle-array
    description: |
      Reference to a PWM instance.

      Includes the PWM channel, the waveform period and
      the PWM polarity.

  pwm-names:
    required: true
    type: string-array
    description: Names for different PWM instance references.
